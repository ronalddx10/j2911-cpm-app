services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itadakimasu-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PDF_OUTPUT_DIR=${PDF_OUTPUT_DIR:-./storage/invoices}
    networks:
      - netowaku-app-network
    restart: always

networks:
  netowaku-app-network:
    external: true
